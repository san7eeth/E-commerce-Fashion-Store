{% load static %}

<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>My Account - Brand Account Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Roboto', sans-serif; }
        .read-only-field {
            background-color: #f3f4f6;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-gray-100">
<div class="min-h-screen flex">
    {% include "brand/sidebar.html" %}
    
    <!-- Main Content -->
    <div class="flex-1 p-10">
        <h1 class="text-3xl font-semibold">My Account</h1>
        
        <div class="mt-6 bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-semibold mb-4">Account Information</h2>
            
            <!-- Update Account Form -->
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Basic Information -->
                    <div>
                        <label class="block text-gray-700" for="brand_name">Brand Name</label>
                        <input class="w-full mt-2 p-2 border rounded-md" id="brand_name" name="brand_name" type="text" value="{{ brand.brand_name }}" required/>
                    </div>
                    <div>
                        <label class="block text-gray-700" for="representative_name">Representative Name</label>
                        <input class="w-full mt-2 p-2 border rounded-md" id="representative_name" name="representative_name" type="text" value="{{ brand.representative_name }}" required/>
                    </div>
                    
                    <!-- Non-editable Fields -->
                    <div>
                        <label class="block text-gray-700" for="email">Email</label>
                        <input class="w-full mt-2 p-2 border rounded-md read-only-field" id="email" name="email" type="email" value="{{ user.email }}" readonly/>
                    </div>
                    <div>
                        <label class="block text-gray-700" for="pan_card">PAN Card</label>
                        <input class="w-full mt-2 p-2 border rounded-md read-only-field" id="pan_card" name="pan_card" type="text" value="{{ brand.pan_card }}" readonly/>
                    </div>
                    
                    <!-- Contact Information -->
                    <div>
                        <label class="block text-gray-700" for="phone">Phone</label>
                        <input class="w-full mt-2 p-2 border rounded-md" id="phone" name="phone" type="text" value="{{ brand.phone }}" required/>
                    </div>
                    <div>
                        <label class="block text-gray-700" for="gstin">GSTIN</label>
                        <input class="w-full mt-2 p-2 border rounded-md read-only-field" id="gstin" name="gstin" type="text" value="{{ brand.gstin }}" readonly/>
                    </div>
                    
                    <!-- Address Information -->
                    <div>
                        <label class="block text-gray-700" for="address">Address</label>
                        <input class="w-full mt-2 p-2 border rounded-md" id="address" name="address" type="text" value="{{ brand.address }}" required/>
                    </div>
                    <div>
                        <label class="block text-gray-700" for="pincode">Pincode</label>
                        <input class="w-full mt-2 p-2 border rounded-md" id="pincode" name="pincode" type="text" value="{{ brand.pincode }}" required/>
                    </div>
                    
                    <!-- Bank Information (Editable) -->
                    <div>
                        <label class="block text-gray-700" for="bank_account_number">Bank Account Number</label>
                        <input class="w-full mt-2 p-2 border rounded-md" id="bank_account_number" name="bank_account_number" type="text" value="{{ brand.bank_account_number }}" required/>
                    </div>
                    <div>
                        <label class="block text-gray-700" for="ifsc_code">IFSC Code</label>
                        <input class="w-full mt-2 p-2 border rounded-md" id="ifsc_code" name="ifsc_code" type="text" value="{{ brand.ifsc_code }}" required/>
                    </div>
                    
                    <!-- Password and Logo -->
                    <div>
                        <label class="block text-gray-700" for="password">New Password</label>
                        <input class="w-full mt-2 p-2 border rounded-md" id="password" name="password" type="password" placeholder="Enter new password"/>
                        <p class="text-sm text-gray-500 mt-1">Leave blank to keep current password</p>
                    </div>
                    <div>
                        <label class="block text-gray-700" for="logo">Brand Logo</label>
                        <input class="w-full mt-2 p-2 border rounded-md" id="logo" name="logo" type="file" accept="image/*"/>
                        {% if brand.logo %}
                            <div class="mt-2 flex items-center">
                                <span class="text-sm text-gray-500 mr-2">Current logo:</span>
                                <img src="{{ brand.logo.url }}" alt="Brand Logo" class="h-10 w-10 rounded-full object-cover"/>
                            </div>
                        {% endif %}
                    </div>
                </div>
                
                <div class="mt-6">
                    <button class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 transition duration-200" type="submit">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        {% if messages %}
            {% for message in messages %}
                Swal.fire({
                    title: "{% if message.tags == 'success' %}Success!{% elif message.tags == 'error' %}Error!{% else %}Info{% endif %}",
                    text: "{{ message }}",
                    icon: "{{ message.tags }}",
                    confirmButtonColor: "#3085d6",
                    confirmButtonText: "OK"
                });
            {% endfor %}
        {% endif %}

        // Add validation for bank details
        const bankAccountInput = document.getElementById('bank_account_number');
        const ifscInput = document.getElementById('ifsc_code');

        bankAccountInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
            if (this.value.length > 18) {
                this.value = this.value.slice(0, 18);
            }
        });

        ifscInput.addEventListener('input', function() {
            this.value = this.value.toUpperCase();
            if (this.value.length > 11) {
                this.value = this.value.slice(0, 11);
            }
        });
    });
</script>
</html>
