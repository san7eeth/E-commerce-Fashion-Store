{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="{% static 'ecommerceapp/images/favicon-32x32.png' %}" type="image/png" />
    <link href="https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <link rel="stylesheet" href="{% static 'ecommerceapp/css/reset.css' %}">
    <title>Reset Password - Fashion Shop</title>
</head>
<body style="background: url('{% static 'ecommerceapp/images/blog-1.png' %}') no-repeat center center fixed; background-size: cover;">
    <div class="reset-container">
        <button class="close-btn" aria-label="Close" onclick="window.location.href='{% url "login" %}';">×</button>
        <div class="reset-content">
            <h2 class="reset-title">Reset Password</h2>
            <p class="reset-description">
                Forgot your password? Enter your email address below, and we'll email instructions for setting a new one.
            </p>
            <form method="post" action="{% url 'reset' %}">
                {% csrf_token %}
                <input type="email" class="reset-input" placeholder="Enter your Registered Email Address" required aria-required="true" />
                <button type="submit" class="reset-btn">Send Link</button>
            </form>
            <a href="{% url 'login' %}" class="back-link">Back to Login</a>
        </div>
    </div>
</body>
</html>
