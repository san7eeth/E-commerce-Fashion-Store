{% load static %}
{% include "customer/customerheader.html" %}
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
</head>
<body class="font-roboto bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen">
    <main class="container mx-auto py-16 px-8">
        <section class="bg-white p-12 rounded-xl shadow-2xl max-w-9xl mx-auto">
            <div class="text-center mb-16">
                <h1 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-pink-600 mb-6">Contact Us</h1>
                <p class="text-gray-600 text-xl leading-relaxed max-w-3xl mx-auto">We’re excited to connect with you! Have questions about our products, pricing, or anything else? Our team is here to assist you every step of the way.</p>
            </div>
            <section class="bg-white p-10 rounded-lg shadow-lg max-w-5xl mx-auto">
                <form>
                    <div class="mb-6">
                        <label class="block text-gray-800 text-lg font-semibold mb-3" for="name">Name</label>
                        <input class="shadow-lg appearance-none border border-gray-300 rounded-lg w-full py-4 px-5 text-gray-700 text-lg leading-tight focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all duration-300" id="name" type="text" placeholder="Your name"/>
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-800 text-lg font-semibold mb-3" for="email">Email</label>
                        <input class="shadow-lg appearance-none border border-gray-300 rounded-lg w-full py-4 px-5 text-gray-700 text-lg leading-tight focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all duration-300" id="email" type="email" placeholder="Your email"/>
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-800 text-lg font-semibold mb-3" for="message">Message</label>
                        <textarea class="shadow-lg appearance-none border border-gray-300 rounded-lg w-full py-4 px-5 text-gray-700 text-lg leading-tight focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all duration-300" id="message" rows="7" placeholder="Your message"></textarea>
                    </div>
                    <div class="flex items-center justify-center">
                        <button class="bg-gradient-to-r from-red-500 to-pink-600 hover:from-red-600 hover:to-pink-700 text-white font-bold text-lg py-4 px-8 rounded-full shadow-lg focus:outline-none focus:ring-4 focus:ring-red-300 transform hover:scale-105 transition-all duration-300" type="button">Send Message</button>
                    </div>
                </form>
            </section>
        </section>
    </main>
    {% include "customer/customerfooter.html" %}
</body>
</html>
