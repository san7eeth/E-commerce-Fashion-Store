<!-- templates/customer/order_success.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success - Fashion Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md text-center max-w-md w-full">
        {% if messages %}
            {% for message in messages %}
                <div class="bg-green-100 text-green-800 p-4 rounded-md mb-6">
                    {{ message }}
                </div>
            {% endfor %}
        {% else %}
            <div class="bg-green-100 text-green-800 p-4 rounded-md mb-6">
                Order placed successfully! Your Order ID is {{ order.order_id }}.
            </div>
        {% endif %}
        <a href="{% url 'customerhome' %}" class="inline-block bg-indigo-600 text-white px-6 py-3 rounded-md hover:bg-indigo-700">
            Go to Customer Home
        </a>
    </div>
</body>
</html>
